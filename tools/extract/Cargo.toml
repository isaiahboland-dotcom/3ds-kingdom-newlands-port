[package]
name = "extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Asset pipeline: Kingdom_Data -> platform-ready assets"
default-run = "extract"

[dependencies]
game = { path = "../../crates/game", features = ["serde", "save"] }
scene = { path = "../../crates/scene", features = ["json", "clipfile"] }
png = "0.18.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"

[features]
profile = ["game/profile"]
